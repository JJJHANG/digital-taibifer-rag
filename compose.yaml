name: digital-taibifer-rag

services:
  api:
    image: digital-taibifer-rag-api
    build:
      context: ./backend
      target: development
    environment: &app_environment
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-taibifer}
      POSTGRES_USER: ${POSTGRES_USER:-taibifer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-30}
      EMBEDDING_MAX_RETRIES: ${EMBEDDING_MAX_RETRIES:-2}
      CHAT_MODEL: ${CHAT_MODEL:-gpt-6-luna}
      CHAT_TOKENIZER: ${CHAT_TOKENIZER:-o200k_base}
      CHAT_MAX_INPUT_TOKENS: ${CHAT_MAX_INPUT_TOKENS:-8000}
      CHAT_MAX_OUTPUT_TOKENS: ${CHAT_MAX_OUTPUT_TOKENS:-1500}
      CHAT_CONTEXT_WINDOW: ${CHAT_CONTEXT_WINDOW:-1050000}
      CHAT_FRAMING_TOKEN_RESERVE: ${CHAT_FRAMING_TOKEN_RESERVE:-256}
      CHAT_TIMEOUT_SECONDS: ${CHAT_TIMEOUT_SECONDS:-60}
      CHAT_MAX_RETRIES: ${CHAT_MAX_RETRIES:-2}
      CHAT_REASONING_EFFORT: ${CHAT_REASONING_EFFORT:-none}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  ingest:
    image: digital-taibifer-rag-api
    profiles: ["tools"]
    environment: *app_environment
    entrypoint: ["python", "-m", "app.ingestion.cli"]
    command: ["--help"]
    volumes:
      - ./.local/knowledge:/knowledge:ro

  adminer:
    image: adminer:6-standalone
    profiles: ["tools"]
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taibifer}
      POSTGRES_USER: ${POSTGRES_USER:-taibifer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "psql -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -tAc \"SELECT 1 FROM pg_extension WHERE extname = 'vector'\" | grep -qx 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
